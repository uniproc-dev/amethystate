[package]
name = "amethystate"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true

[features]
default = ["redb"]
json = ["text"]
toml = ["dep:toml_edit", "text"]
ron = ["dep:ron", "text"]
# SQLite is compiled in rather than linked from the system, so the floor this
# library imposes is this library's own. Linking the system one hands that
# choice to whatever the user's distribution ships, and a feature we adopt later
# can raise the floor by years without SQLite recording that it did - `STRICT`
# moves it to 3.37 while leaving the header untouched, so an older build reports
# a corrupt schema for an intact file.
sqlite = ["dep:rusqlite", "dep:sonic-rs", "dep:parking_lot", "rusqlite/bundled"]
redb = ["dep:redb", "dep:rmp-serde", "dep:parking_lot", "dep:arc-swap"]
text = ["dep:tempfile", "dep:parking_lot", "dep:notify"]

async = ["amethystate-core/async"]
tauri = ["amethystate-macros/tauri", "amethystate-tauri", "async"]

test-utils = ["amethystate-core/test-utils"]

# Counts every allocation in the profiling example and attributes it to where
# it was made. Off by default because it replaces the global allocator and
# records a backtrace per allocation, which makes any timing meaningless.
dhat-heap = []

# Opens `store::backend::utils` so a bench can reach it. A bench is a separate
# crate and cannot see a private module; none of what this exposes is API.
bench-internals = []

# The compile-fail goldens: trybuild compiles a crate per case and costs more
# than the rest of the suite put together. Off by default so an ordinary run
# stays quick; CI turns it on, which is what keeps the `.stderr` files from
# rotting.
golden = []


[dependencies]
erased-serde.workspace = true
rayon = { workspace = true }
rusqlite = { workspace = true, optional = true }
sonic-rs = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }
amethystate-core = { workspace = true }
amethystate-tauri = { workspace = true, optional = true }
petgraph = { workspace = true }
amethystate-macros = { workspace = true }
serde = { workspace = true }
error-stack = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
redb = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["preserve_order"] }
directories = { workspace = true }
inventory = { workspace = true }
futures-core = { workspace = true }
parking_lot = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
etcetera.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = [ "v4", "js", "serde"] }

[dev-dependencies]
amethystate = { path = ".", features = ["redb", "sqlite", "json", "toml", "ron"] }
amethystate-test-macros = { path = "../../test/amethystate-test-macros" }
insta.workspace = true
serde_json = { workspace = true }
amethystate-core = { workspace = true, features = ["test-utils", "proptest-strategies"] }
criterion = { workspace = true }
futures = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
trybuild = { workspace = true }
tracing-test = { workspace = true }
serial_test.workspace = true
dashmap = { workspace = true }
smol_str = { workspace = true }
rmp-serde = { workspace = true }
dhat.workspace = true
im.workspace = true
rpds = { workspace = true }

[[bench]]
name = "store_bench"
harness = false

[[bench]]
name = "cell_dispatch_bench"
harness = false

[[bench]]
name = "reactive_map_bench"
harness = false

[[bench]]
name = "signal_arc_bench"
harness = false

[[bench]]
name = "map_cache_shape"
harness = false

[[bench]]
name = "scan_merge_bench"
harness = false
required-features = ["bench-internals", "redb"]

[[bench]]
name = "map_snapshot_bench"
harness = false

[[bench]]
name = "map_snapshot_memory"
harness = false
