[package]
name = "amethystate"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true

[features]
default = []
json = ["text"]
toml = ["dep:toml_edit", "text"]
ron = ["dep:ron", "text"]
# SQLite is compiled in rather than linked from the system, so the floor this
# library imposes is this library's own. Linking the system one hands that
# choice to whatever the user's distribution ships, and a feature we adopt later
# can raise the floor by years without SQLite recording that it did - `STRICT`
# moves it to 3.37 while leaving the header untouched, so an older build reports
# a corrupt schema for an intact file.
sqlite = ["dep:rusqlite", "dep:sonic-rs", "rusqlite/bundled"]
redb = ["dep:redb", "dep:rmp-serde", "dep:arc-swap"]
text = ["dep:tempfile", "dep:notify"]
# A store with no file, for a store that has nowhere to be kept and for the one
# an application falls back to when its file will not open. It writes
# MessagePack, as redb does, so it holds everything any engine here holds.
memory = ["dep:rmp-serde"]
# The browser's localStorage, one JSON value per key. Answers only inside a
# page: anywhere else the open is refused.
localstorage = ["dep:web-sys", "dep:wasm-bindgen"]

async = ["amethystate-core/async"]
tauri = ["amethystate-macros/tauri", "amethystate-tauri", "async"]

test-utils = ["amethystate-core/test-utils"]

# Counts every allocation in the profiling example and attributes it to where
# it was made. Off by default because it replaces the global allocator and
# records a backtrace per allocation, which makes any timing meaningless.
dhat-heap = []

# Opens `store::backend` so a bench or a test can reach the engines' insides - the
# documents, the diff, the write buffer's merge. A bench is a separate crate and
# cannot see a private module; none of what this exposes is API, and the
# concrete stores reach a user through `amethystate::stores` either way.
bench-internals = []

# Renders the migration report the way a compiler renders a warning: the
# prefix that drifted, every place under it that moved, and what each one
# amounts to, laid out by `miette`.
#
# Off by default because it is a presentation, and a presentation costs a
# dependency tree with a terminal renderer in it. Detection is not behind this -
# a drift report is built either way and `has_drift` answers either way; what
# this adds is the way it looks. Turn it on where a person reads the output.
diagnostics = ["dep:miette", "miette/fancy"]

# The compile-fail goldens: trybuild compiles a crate per case and costs more
# than the rest of the suite put together. Off by default so an ordinary run
# stays quick; CI turns it on, which is what keeps the `.stderr` files from
# rotting.
golden = []


[dependencies]
erased-serde.workspace = true
rayon = { workspace = true }
rusqlite = { workspace = true, optional = true }
sonic-rs = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }
amethystate-core = { workspace = true }
amethystate-tauri = { workspace = true, optional = true }
amethystate-macros = { workspace = true }
serde = { workspace = true }
error-stack = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true, optional = true }
tracing = { workspace = true }
redb = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["preserve_order"] }
directories = { workspace = true }
indexmap = { workspace = true }
xxhash-rust = { workspace = true }
inventory = { workspace = true }
dashmap = { workspace = true }
futures-core = { workspace = true }
parking_lot = { workspace = true }
toml_edit = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
web-sys = { version = "0.3.102", optional = true, features = ["Window", "Storage", "StorageEvent", "EventTarget", "Event"] }
wasm-bindgen = { version = "0.2.125", optional = true }
etcetera.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = [ "v4", "js", "serde"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3.102"

[dev-dependencies]
anyhow = { workspace = true }
amethystate-test-macros = { path = "../../test/amethystate-test-macros" }
insta = { package = "amethystate-page-insta", path = "../../test/amethystate-page-insta" }
serde_json = { workspace = true }
amethystate-core = { workspace = true, features = ["test-utils", "proptest-strategies"] }
futures = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
tracing-test = { package = "amethystate-page-tracing-test", path = "../../test/amethystate-page-tracing-test" }
serial_test.workspace = true
dashmap = { workspace = true }
smol_str = { workspace = true }
rmp-serde = { workspace = true }
im.workspace = true
rpds = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
amethystate = { path = ".", features = ["memory", "localstorage", "test-utils"] }
wasm-bindgen-test = "0.3"
wasm-bindgen = "0.2.125"
getrandom-03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3.102", features = ["Window", "Storage", "StorageEvent", "StorageEventInit", "EventTarget", "Event"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
amethystate = { path = ".", features = ["redb", "sqlite", "json", "toml", "ron", "memory", "test-utils"] }
criterion = { workspace = true }
trybuild = { workspace = true }
dhat.workspace = true

[[bench]]
name = "store_bench"
harness = false

[[bench]]
name = "cell_dispatch_bench"
harness = false

[[bench]]
name = "reactive_map_bench"
harness = false

[[bench]]
name = "signal_arc_bench"
harness = false

[[bench]]
name = "map_cache_shape"
harness = false

[[bench]]
name = "scan_merge_bench"
harness = false
required-features = ["bench-internals", "redb"]

[[bench]]
name = "map_snapshot_bench"
harness = false

[[bench]]
name = "map_snapshot_memory"
harness = false

[[bench]]
name = "text_document_bench"
harness = false
required-features = ["bench-internals", "json"]

[package.metadata.docs.rs]
features = ["redb", "sqlite", "json", "toml", "ron", "memory", "async", "diagnostics"]
