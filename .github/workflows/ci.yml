name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libatk1.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, rust-src
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libatk1.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude amethystate-gpui --all-targets --all-features -- -D warnings

  # One engine at a time, and it holds: without --all-targets the dev-dependency
  # this crate has on itself is not built, so its five-engine feature list is not
  # unified in. The test job cannot restrict this way for exactly that reason.
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [ redb, sqlite, json, toml, ron ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-${{ matrix.engine }}
      - run: cargo clippy -p amethystate --no-default-features --features ${{ matrix.engine }} -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libatk1.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev

      # A text store watches its own file, which is one inotify instance, and
      # the conformance suite opens hundreds of stores at once across its
      # threads. The runner's default of 128 is a budget for a desktop session,
      # not for a test binary; going over it fails the open with EMFILE.
      - name: Raise the inotify budget (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w fs.inotify.max_user_instances=1024

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-expand
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - run: cargo test --workspace --exclude amethystate-gpui --all-features

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libatk1.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --exclude amethystate-gpui --all-features --no-deps
      - run: cargo xtask book --check
      - run: cargo xtask docs --check