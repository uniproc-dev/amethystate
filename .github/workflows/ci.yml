name: CI

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libatk1.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, rust-src
      - run: cargo fmt --all --check

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libatk1.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude amethystate-gpui --all-targets --all-features -- -D warnings

  # One engine at a time, and it holds: without --all-targets the dev-dependency
  # this crate has on itself is not built, so its five-engine feature list is not
  # unified in. The test job cannot restrict this way for exactly that reason.
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [ redb, sqlite, json, toml, ron ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-${{ matrix.engine }}
      - run: cargo clippy -p amethystate --no-default-features --features ${{ matrix.engine }} -- -D warnings

  no-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-engine
      - run: cargo clippy -p amethystate -- -D warnings

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libatk1.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: amethystate-macros-core,amethystate-core,amethystate-tauri,amethystate,amethystate-codegen,amethystate-arena,tauri-plugin-amethystate
          feature-group: all-features

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libatk1.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-expand
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - run: cargo test --workspace --exclude amethystate-gpui --all-features

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.125
      - if: matrix.shard == 1
        run: cargo clippy -p amethystate --target wasm32-unknown-unknown --tests -- -D warnings
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo xtask browser --shard ${{ matrix.shard }}/4

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libatk1.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --exclude amethystate-gpui --all-features --no-deps
      - run: cargo xtask book --check
      - run: cargo xtask docs --check