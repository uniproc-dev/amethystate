name: Publish

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the tagged commit is on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master: a release is cut from what master holds, after its checks passed there"
            exit 1
          fi

      - name: Verify tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match [workspace.package].version ($CARGO_VERSION) in Cargo.toml"
            exit 1
          fi

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libatk1.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: amethystate-macros-core,amethystate-core,amethystate-tauri,amethystate,amethystate-codegen,amethystate-arena,tauri-plugin-amethystate
          feature-group: all-features

  publish:
    needs: [version, semver]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libatk1.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Publish order follows the internal dependency graph (leaves first).
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -e
          CRATES=(
            amethystate-macros-core
            amethystate-core
            amethystate-macros
            amethystate-macros-arena
            amethystate-tauri
            amethystate
            amethystate-codegen
            amethystate-arena
            tauri-plugin-amethystate
            amethystate-dioxus
            amethystate-leptos
            amethystate-yew
            amethystate-slint
            amethystate-gpui
            amethystate-guinea
          )
          VERSION="${GITHUB_REF_NAME#v}"
          for crate in "${CRATES[@]}"; do
            # A rerun after a partial failure picks up where the last run
            # stopped: a version crates.io already holds cannot be published
            # again, and is the one this tag asked for.
            if curl -sf -A "amethystate-publish (https://github.com/${GITHUB_REPOSITORY})" \
                "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null; then
              echo "$crate $VERSION is on crates.io already"
              continue
            fi
            echo "::group::cargo publish -p $crate"
            for attempt in 1 2 3; do
              if cargo publish -p "$crate" --locked; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to publish $crate after 3 attempts"
                exit 1
              fi
              echo "Publish of $crate failed (attempt $attempt), retrying in 20s..."
              sleep 20
            done
            echo "::endgroup::"
            # give crates.io's index a moment to propagate before the next
            # crate (which may depend on this one) tries to resolve it
            sleep 20
          done
