[package]
name = "tauri-yew-ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
amethystate = { path = "../../crates/main/amethystate", features = ["tauri"] }
amethystate-yew = { path = "../../crates/adapters/amethystate-yew" }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
log = "0.4"
shared = { path = "./shared" }
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
yew = { version = "0.23.0", features = ["csr"] }

[workspace]
members = ["shared", "src-tauri"]
