[package]
name = "tauri-typescript"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "tauri-typescript"

[lib]
name = "tauri_typescript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
amethystate = { path = "../../../crates/main/amethystate", features = ["redb"] }
amethystate-codegen = { path = "../../../crates/tauri/amethystate-codegen" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-amethystate = { path = "../../../crates/tauri/tauri-plugin-amethystate" }
ts-rs = "12"

[workspace]

[[bin]]
name = "codegen"
path = "bin/codegen.rs"
